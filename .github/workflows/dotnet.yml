name: build-publish

on:
  push:
    branches: [ master ]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      # SkipWebAssets skips the npm/sass web-asset build; the tests only exercise managed code.
      - name: Test
        run: dotnet test OW3N.Tests/OW3N.Tests.csproj --configuration Release -p:SkipWebAssets=true

  build:
    needs: test
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup dotnet
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build --configuration Release

      - name: Publish
        run: dotnet publish --configuration Release -o out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-publish
          path: out
